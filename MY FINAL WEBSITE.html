html<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hot Beans Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background-color: #f0f9ff;
            margin: 0;
            padding: 0;
        }

        .top-bar {
            background-color: #f0f9ff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo-image {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }

        .logo-text {
            color: #0a2540;
        }

        .logo-text h1 {
            margin: 0;
        }

        .logo-text p {
            margin: 0;
        }

        .menu {
            display: flex;
        }

        .menu a {
            margin-left: 30px;
            color: #0a2540;
            text-decoration: none;
            font-weight: bold;
        }

        .main {
            display: flex;
            padding: 20px;
            margin-top: 80px;
        }

        .text-section {
            width: 50%;
        }

        .image-section {
            width: 10%;
        }

        .join-text {
            font-size: 54px;
            color: #0a2540;
            line-height: 1;
        }

        .apply-button {
            background-color: #f05a28;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            margin-top: 20px;
            margin-right: 10px;
            font-weight: bold;
        }

        .jobs-button {
            background-color: #dae8f0;
            color: #0a2540;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .team.jpg {
            width: 50%;
            border-radius: 30px;
        }

        .line {
            width: 80%;
            margin: 20px auto;
            border-bottom: 1px solid #ccc;
        }

        .footer {
            text-align: center;
            padding: 20px;
        }

        .footer span {
            margin: 0 40px;
            font-size: 24px;
            color: black;
        }

        .bottom-bar {
            background-color: #0a2540;
            height: 60px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            width: 60%;
        }

        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: red;
        }

        /* Fix 4 — Focus styles for keyboard navigation */
        a:focus, button:focus {
            outline: 2px solid #0a2540;
            outline-offset: 3px;
        }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">
            <!-- Fix 1 — Descriptive alt text replacing filename -->
            <img src="image2.jpg" alt="Hot Beans Web company logo" class="logo-image">
            <div class="logo-text">
                <h1>Hot Beans</h1>
                <p>Web</p>
            </div>
        </div>
        <div class="menu">
            <a href="company-profile.html">Company Profile</a>
            <a href="trainee-profile.html">Trainee Profiles</a>
            <a href="course-profile.html">Courses</a>
        </div>
    </div>

    <div class="main">
        <div class="text-section">
            <div class="join-text">
                Join<br>
                Our<br>
                Team &rarr;
            </div>
            <a href="apply.html" class="apply-button">Apply Now</a>
            <button class="jobs-button" onclick="openModal()">Job Openings</button>
        </div>
        <div class="image-section">
            <img class="team.jpg" src="team.jpg" alt="Team working together">
        </div>
    </div>

    <div class="line"></div>
    <div class="footer">
        <!-- Fix 3 — Aria-labels on footer emoji icons -->
        <span aria-label="Our location">📍</span>
        <span aria-label="Call us">📞</span>
        <span aria-label="Email us">✉️</span>
    </div>
    <div class="bottom-bar"></div>

    <!-- Modal Structure -->
    <div id="jobModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Current Job Openings</h2>
            <ul>
                <li><strong>Front-End Developer</strong> – HTML, CSS, JavaScript (Remote)</li>
                <li><strong>Back-End Developer</strong> – Node.js, MongoDB (On-site)</li>
                <li><strong>UI/UX Designer</strong> – Figma, Adobe XD (Hybrid)</li>
            </ul>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("jobModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("jobModal").style.display = "none";
        }

        window.onclick = function(event) {
            let modal = document.getElementById("jobModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
