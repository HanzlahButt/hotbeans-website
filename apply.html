<html>
<head>
  <title>Apply to Join Hot Beans Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f9ff;
      padding: 20px;
    }

    form {
      max-width: 400px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #f05a28;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>Apply to Join Hot Beans Web</h2>
  <p>
    We're always looking for passionate trainees who are ready to learn and grow in web development. 
    Fill out the form below and take your first step toward joining the team!
  </p>

  <form id="applicationForm">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name">

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email">

    <label for="skills">Your Skills or Interests:</label>
    <textarea id="skills" name="skills" rows="4"></textarea>

    <div id="errorMsg" class="error"></div>

    <button type="submit">Submit Application</button>
  </form>

  <script>
    document.getElementById("applicationForm").addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent default form submission

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const skills = document.getElementById("skills").value.trim();
      const error = document.getElementById("errorMsg");

      if (!name || !email || !skills) {
        error.textContent = "Please fill in all required fields.";
        return;
      }

      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      if (!emailPattern.test(email)) {
        error.textContent = "Please enter a valid email address.";
        return;
      }

      error.textContent = "";
      alert("Application submitted successfully!");
    });
  </script>

</body>
</html>
